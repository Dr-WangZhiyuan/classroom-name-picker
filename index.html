<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name Picker Slot Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000010;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Press Start 2P', monospace;
  overflow: hidden;
  user-select: none;
}

/* ── Scanline overlay ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* ── HUD (top stats bar) ── */
.hud {
  display: flex;
  gap: 40px;
  margin-bottom: 20px;
  color: #fff;
  font-size: 10px;
  letter-spacing: 1px;
}
.hud-item { opacity: 0.8; }
.hud-value { color: #f0d848; }

/* ── Machine wrapper ── */
.machine-wrapper {
  position: relative;
  display: flex;
  align-items: stretch;
}

/* ── Slot Machine ── */
.machine {
  position: relative;
  width: 480px;
  background: linear-gradient(180deg, #2a5090, #1a3868, #1e4070, #1a3868, #2a5090);
  border: 5px solid #b89818;
  border-radius: 14px;
  padding: 0;
  box-shadow:
    inset 0 2px 6px rgba(255,255,255,0.15),
    inset 0 -2px 6px rgba(0,0,0,0.4),
    0 0 40px rgba(184,152,24,0.2),
    0 8px 32px rgba(0,0,0,0.7);
}

/* ── Gold rivets ── */
.machine::before, .machine::after {
  content: '';
  position: absolute;
  width: 10px; height: 10px;
  background: radial-gradient(circle at 35% 35%, #f8e060, #b89818, #8a7010);
  border-radius: 50%;
  border: 1px solid #7a6010;
  z-index: 5;
}
.machine::before { top: 8px; left: 8px; }
.machine::after { top: 8px; right: 8px; }

/* ── Top Banner ── */
.banner {
  background: linear-gradient(180deg, #e8c838, #c8a020, #b89818);
  text-align: center;
  padding: 12px 20px;
  border-radius: 8px 8px 0 0;
  border-bottom: 3px solid #8a7010;
  position: relative;
}
.banner span {
  font-size: 18px;
  color: #1a1a40;
  text-shadow: 1px 1px 0 rgba(255,255,255,0.3);
  letter-spacing: 3px;
}

/* ── Machine body interior ── */
.machine-body {
  padding: 24px 28px;
  display: flex;
  align-items: center;
  gap: 0;
}

/* ── Display frame (gold border around window) ── */
.display-frame {
  flex: 1;
  border: 4px solid #c8a828;
  border-radius: 8px;
  padding: 4px;
  background: linear-gradient(180deg, #d8b830, #a88818, #d8b830);
  box-shadow:
    inset 0 0 8px rgba(0,0,0,0.3),
    0 0 12px rgba(200,168,40,0.3);
}

/* ── Display window (where names appear) ── */
.display-window {
  background: #000820;
  border-radius: 4px;
  height: 72px;
  overflow: hidden;
  position: relative;
  box-shadow: inset 0 0 20px rgba(0,0,80,0.8);
}

/* ── Reel strip ── */
.reel {
  position: absolute;
  width: 100%;
  top: 0;
  left: 0;
  will-change: transform;
}
.reel.animating {
  transition: transform 4s cubic-bezier(0.0, 0.45, 0.1, 1.0);
}
.reel-item {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 14px;
  white-space: nowrap;
  text-shadow: 0 0 8px rgba(100,180,255,0.6);
  padding: 0 12px;
}
.reel-item.long-name {
  font-size: 11px;
}
.reel-item.very-long-name {
  font-size: 9px;
}

/* Glow effect on the display edges */
.display-window::before, .display-window::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 16px;
  z-index: 2;
  pointer-events: none;
}
.display-window::before {
  top: 0;
  background: linear-gradient(180deg, #000820, transparent);
}
.display-window::after {
  bottom: 0;
  background: linear-gradient(0deg, #000820, transparent);
}

/* ── Winner glow ── */
.display-window.winner {
  box-shadow:
    inset 0 0 20px rgba(0,0,80,0.8),
    inset 0 0 30px rgba(255,200,0,0.3),
    0 0 20px rgba(255,200,0,0.4);
}
.display-window.winner .reel-item:last-child {
  color: #f0d848;
  text-shadow: 0 0 12px rgba(255,200,0,0.8), 0 0 24px rgba(255,200,0,0.4);
  animation: winner-pulse 0.6s ease-in-out infinite alternate;
}
@keyframes winner-pulse {
  from { transform: scale(1); }
  to { transform: scale(1.08); }
}

/* ── Lever ── */
.lever {
  width: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: absolute;
  right: -44px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  z-index: 10;
}
.lever-base {
  width: 20px;
  height: 8px;
  background: linear-gradient(90deg, #666, #aaa, #666);
  border-radius: 2px;
}
.lever-shaft {
  width: 8px;
  height: 60px;
  background: linear-gradient(90deg, #888, #ccc, #999, #ccc, #888);
  border-radius: 3px;
  transition: height 0.2s ease;
}
.lever-knob {
  width: 28px;
  height: 28px;
  background: radial-gradient(circle at 38% 35%, #ff5555, #cc1111, #880808);
  border-radius: 50%;
  border: 2px solid #660808;
  box-shadow: 0 2px 6px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.2);
  transition: transform 0.2s ease;
}
.lever.pulled .lever-knob {
  transform: translateY(36px);
}
.lever.pulled .lever-shaft {
  height: 24px;
}
.lever:hover .lever-knob {
  box-shadow: 0 2px 10px rgba(255,50,50,0.5), inset 0 2px 4px rgba(255,255,255,0.2);
}

/* ── Bottom section ── */
.machine-bottom {
  padding: 16px 28px 8px;
  text-align: center;
}
.coin-tray {
  background: linear-gradient(180deg, #1a3060, #0e2040);
  border: 3px solid #b89818;
  border-radius: 50%;
  width: 100px;
  height: 100px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 4px 12px rgba(0,0,0,0.6);
}
.coin-tray-label {
  color: #c8a828;
  font-size: 8px;
  letter-spacing: 1px;
  line-height: 1.6;
  text-align: center;
}

/* ── Bottom rivets ── */
.bottom-rivets {
  display: flex;
  justify-content: space-between;
  padding: 0 10px 10px;
}
.rivet {
  width: 10px; height: 10px;
  background: radial-gradient(circle at 35% 35%, #f8e060, #b89818, #8a7010);
  border-radius: 50%;
  border: 1px solid #7a6010;
}

/* ── Pull button ── */
.pull-btn {
  display: block;
  margin: 16px auto 24px;
  padding: 14px 48px;
  font-family: 'Press Start 2P', monospace;
  font-size: 16px;
  color: #fff;
  background: linear-gradient(180deg, #dd2222, #aa1111, #881010);
  border: 3px solid #660808;
  border-radius: 8px;
  cursor: pointer;
  letter-spacing: 2px;
  box-shadow:
    0 4px 0 #550505,
    0 6px 12px rgba(0,0,0,0.4),
    inset 0 1px 2px rgba(255,255,255,0.2);
  transition: all 0.1s ease;
}
.pull-btn:hover {
  background: linear-gradient(180deg, #ee3333, #cc2222, #991515);
  box-shadow:
    0 4px 0 #550505,
    0 6px 16px rgba(255,50,50,0.3),
    inset 0 1px 2px rgba(255,255,255,0.2);
}
.pull-btn:active {
  transform: translateY(3px);
  box-shadow:
    0 1px 0 #550505,
    0 2px 4px rgba(0,0,0,0.4),
    inset 0 1px 2px rgba(255,255,255,0.2);
}
.pull-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* ── Controls row ── */
.controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 16px;
}
.ctrl-btn {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: #8ab;
  background: transparent;
  border: 2px solid #345;
  border-radius: 4px;
  padding: 8px 14px;
  cursor: pointer;
  transition: all 0.15s ease;
  letter-spacing: 1px;
}
.ctrl-btn:hover {
  color: #bdf;
  border-color: #68a;
  background: rgba(40,80,120,0.3);
}

/* ── History panel ── */
.history {
  margin-top: 20px;
  width: 480px;
  max-height: 160px;
  overflow-y: auto;
}
.history h3 {
  color: #68a;
  font-size: 8px;
  margin-bottom: 8px;
  letter-spacing: 2px;
}
.history-item {
  color: #5a7a9a;
  font-size: 9px;
  padding: 4px 0;
  border-bottom: 1px solid #112;
  display: flex;
  justify-content: space-between;
}
.history-item:first-child {
  color: #f0d848;
}
.history-num { opacity: 0.5; }

/* ── Overlays ── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,16,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.overlay.hidden { display: none; }

.panel {
  background: linear-gradient(180deg, #1a2a48, #0e1a30);
  border: 3px solid #b89818;
  border-radius: 12px;
  padding: 32px;
  width: 460px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 0 60px rgba(184,152,24,0.15);
}
.panel h2 {
  color: #f0d848;
  font-size: 14px;
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 2px;
}
.panel p {
  color: #8ab;
  font-size: 8px;
  text-align: center;
  margin-bottom: 16px;
  line-height: 1.8;
}
.panel textarea {
  width: 100%;
  height: 220px;
  background: #000820;
  color: #ddeeff;
  border: 2px solid #345;
  border-radius: 6px;
  padding: 12px;
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  line-height: 2;
  resize: vertical;
  outline: none;
}
.panel textarea:focus {
  border-color: #68a;
  box-shadow: 0 0 12px rgba(80,160,255,0.15);
}
.panel textarea::placeholder {
  color: #345;
}
.panel-btn {
  display: block;
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  color: #1a1a40;
  background: linear-gradient(180deg, #e8c838, #c8a020);
  border: 2px solid #8a7010;
  border-radius: 6px;
  cursor: pointer;
  letter-spacing: 2px;
  transition: all 0.15s ease;
}
.panel-btn:hover {
  background: linear-gradient(180deg, #f0d848, #d8b830);
}
.panel-row {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}
.panel-row .panel-btn { margin-top: 0; }
.panel-btn.secondary {
  background: linear-gradient(180deg, #2a4a7a, #1a3060);
  color: #8ab;
  border-color: #345;
}
.panel-btn.secondary:hover {
  background: linear-gradient(180deg, #3a5a8a, #2a4070);
  color: #bdf;
}
.panel-btn.danger {
  background: linear-gradient(180deg, #6a2020, #4a1515);
  color: #e88;
  border-color: #4a1515;
}
.panel-btn.danger:hover {
  background: linear-gradient(180deg, #7a2a2a, #5a2020);
}

.panel label {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #8ab;
  font-size: 8px;
  margin-top: 14px;
  cursor: pointer;
}
.panel input[type="checkbox"] {
  accent-color: #c8a828;
  width: 16px;
  height: 16px;
}

/* ── Confetti ── */
.confetti-piece {
  position: fixed;
  width: 8px;
  height: 8px;
  z-index: 200;
  pointer-events: none;
  animation: confetti-fall linear forwards;
}
@keyframes confetti-fall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
}

/* ── No-names message ── */
.empty-msg {
  color: #5a7a9a;
  font-size: 10px;
  text-align: center;
  padding: 24px 0;
  line-height: 2;
}

/* ── All picked flash ── */
.all-picked {
  color: #f0d848;
  font-size: 10px;
  text-align: center;
  margin-top: 12px;
  animation: blink 1s step-end infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}

/* ── Responsive ── */
@media (max-width: 580px) {
  .machine { width: 340px; }
  .history { width: 340px; }
  .reel-item { font-size: 11px; }
  .banner span { font-size: 13px; }
  .panel { width: 340px; padding: 20px; }
  .lever { right: -36px; }
}
</style>
</head>
<body>

<!-- ── SETUP OVERLAY ── -->
<div class="overlay" id="setup-overlay">
  <div class="panel">
    <h2>NAME PICKER</h2>
    <p>PASTE STUDENT NAMES BELOW<br>(ONE NAME PER LINE)</p>
    <textarea id="setup-names" placeholder="e.g.&#10;Alice&#10;Bob&#10;Charlie"></textarea>
    <button class="panel-btn" id="setup-save">START</button>
  </div>
</div>

<!-- ── SETTINGS OVERLAY ── -->
<div class="overlay hidden" id="settings-overlay">
  <div class="panel">
    <h2>SETTINGS</h2>
    <p>EDIT NAMES (ONE PER LINE)</p>
    <textarea id="settings-names"></textarea>
    <label>
      <input type="checkbox" id="no-repeat-check">
      NO-REPEAT MODE (skip picked names)
    </label>
    <button class="panel-btn" id="settings-save">SAVE</button>
    <div class="panel-row">
      <button class="panel-btn secondary" id="settings-close">CANCEL</button>
      <button class="panel-btn danger" id="settings-reset">RESET ALL</button>
    </div>
  </div>
</div>

<!-- ── MAIN SCREEN ── -->
<div id="main-screen" style="display:none;">

  <!-- HUD -->
  <div class="hud">
    <div class="hud-item">PICKED: <span class="hud-value" id="hud-picked">0</span></div>
    <div class="hud-item">REMAINING: <span class="hud-value" id="hud-remaining">0</span></div>
  </div>

  <!-- Machine + Lever -->
  <div class="machine-wrapper">
    <div class="machine">
      <!-- Banner -->
      <div class="banner"><span>WHO'S NEXT?</span></div>

      <!-- Body -->
      <div class="machine-body">
        <div class="display-frame">
          <div class="display-window" id="display-window">
            <div class="reel" id="reel">
              <div class="reel-item">READY</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom decorative -->
      <div class="machine-bottom">
        <div class="coin-tray">
          <div class="coin-tray-label">NAME<br>PICKER</div>
        </div>
      </div>

      <!-- Bottom rivets -->
      <div class="bottom-rivets">
        <div class="rivet"></div>
        <div class="rivet"></div>
      </div>

      <!-- Pull button -->
      <button class="pull-btn" id="pull-btn">PULL!</button>
    </div>

    <!-- Lever -->
    <div class="lever" id="lever" title="Pull the lever!">
      <div class="lever-knob"></div>
      <div class="lever-shaft"></div>
      <div class="lever-base"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn" id="btn-settings">SETTINGS</button>
    <button class="ctrl-btn" id="btn-clear-history">CLEAR HISTORY</button>
    <button class="ctrl-btn" id="btn-sound">SOUND: ON</button>
  </div>

  <!-- History -->
  <div class="history" id="history-panel"></div>

  <!-- All-picked message -->
  <div class="all-picked hidden" id="all-picked-msg">ALL NAMES PICKED! RESET TO CONTINUE.</div>
</div>

<script>
const ITEM_HEIGHT = 72;
const SPIN_DURATION = 4000;
const SPIN_CYCLES = 4;

let names = [];
let pickedNames = [];
let noRepeat = false;
let soundOn = true;
let spinning = false;
let audioCtx = null;

// ── LocalStorage helpers ──
function saveNames() { localStorage.setItem('np_names', JSON.stringify(names)); }
function loadNames() {
  try { return JSON.parse(localStorage.getItem('np_names')) || []; }
  catch { return []; }
}
function savePicked() { localStorage.setItem('np_picked', JSON.stringify(pickedNames)); }
function loadPicked() {
  try { return JSON.parse(localStorage.getItem('np_picked')) || []; }
  catch { return []; }
}
function savePrefs() { localStorage.setItem('np_prefs', JSON.stringify({ noRepeat, soundOn })); }
function loadPrefs() {
  try { return JSON.parse(localStorage.getItem('np_prefs')) || {}; }
  catch { return {}; }
}

// ── Title Case conversion ──
function toTitleCase(str) {
  const lower = str.toLowerCase().trim();
  return lower.replace(/(?:^|\s)\S/g, c => c.toUpperCase());
}

// ── Name size class ──
function nameSizeClass(name) {
  if (name.length > 28) return 'very-long-name';
  if (name.length > 20) return 'long-name';
  return '';
}

// ── Parse name input ──
function parseNames(text) {
  return text.split('\n')
    .map(l => l.trim())
    .filter(l => l.length > 0)
    .map(toTitleCase);
}

// ── Available names (respecting no-repeat) ──
function availableNames() {
  if (!noRepeat) return [...names];
  return names.filter(n => !pickedNames.includes(n));
}

// ── Shuffle array ──
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ── Update HUD ──
function updateHUD() {
  const avail = availableNames();
  document.getElementById('hud-picked').textContent = pickedNames.length;
  document.getElementById('hud-remaining').textContent = avail.length;

  const allPickedMsg = document.getElementById('all-picked-msg');
  if (noRepeat && avail.length === 0 && names.length > 0) {
    allPickedMsg.classList.remove('hidden');
  } else {
    allPickedMsg.classList.add('hidden');
  }
}

// ── Update History ──
function updateHistory() {
  const panel = document.getElementById('history-panel');
  if (pickedNames.length === 0) {
    panel.innerHTML = '';
    return;
  }
  let html = '<h3>HISTORY</h3>';
  const reversed = [...pickedNames].reverse();
  reversed.forEach((name, i) => {
    html += `<div class="history-item"><span>${name}</span><span class="history-num">#${pickedNames.length - i}</span></div>`;
  });
  panel.innerHTML = html;
}

// ── Audio ──
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTick() {
  if (!soundOn || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.value = 800 + Math.random() * 400;
  gain.gain.value = 0.06;
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.03);
}

function playWin() {
  if (!soundOn || !audioCtx) return;
  const notes = [523, 659, 784, 1047];
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.value = 0;
    gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.12);
    gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + i * 0.12 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.12 + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + i * 0.12);
    osc.stop(audioCtx.currentTime + i * 0.12 + 0.25);
  });
}

function playLever() {
  if (!soundOn || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.value = 150;
  osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
  gain.gain.value = 0.08;
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.15);
}

// ── Confetti ──
function spawnConfetti() {
  const colors = ['#f0d848', '#ff4444', '#44aaff', '#44ff88', '#ff88ff', '#ff8844'];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = '-10px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    el.style.animationDelay = (Math.random() * 0.5) + 's';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    el.style.width = (5 + Math.random() * 6) + 'px';
    el.style.height = (5 + Math.random() * 6) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

// ── Build reel and spin ──
function spin() {
  const avail = availableNames();
  if (avail.length === 0 || spinning) return;

  spinning = true;
  initAudio();
  playLever();

  const pullBtn = document.getElementById('pull-btn');
  pullBtn.disabled = true;

  const lever = document.getElementById('lever');
  lever.classList.add('pulled');
  setTimeout(() => lever.classList.remove('pulled'), 300);

  const displayWindow = document.getElementById('display-window');
  displayWindow.classList.remove('winner');

  const targetName = avail[Math.floor(Math.random() * avail.length)];

  const reel = document.getElementById('reel');
  reel.classList.remove('animating');
  reel.style.transform = 'translateY(0)';
  reel.innerHTML = '';

  const reelNames = [];
  for (let c = 0; c < SPIN_CYCLES; c++) {
    reelNames.push(...shuffle([...names]));
  }
  reelNames.push(targetName);

  reelNames.forEach(name => {
    const div = document.createElement('div');
    div.className = 'reel-item ' + nameSizeClass(name);
    div.textContent = name;
    reel.appendChild(div);
  });

  const targetY = -((reelNames.length - 1) * ITEM_HEIGHT);

  // Tick sounds during animation
  let tickCount = 0;
  const totalTicks = reelNames.length;
  function scheduleTicks() {
    let elapsed = 0;
    for (let i = 0; i < totalTicks - 1; i++) {
      const progress = i / (totalTicks - 1);
      const t = solveCubicBezier(progress);
      const tickTime = t * SPIN_DURATION;
      if (tickTime > elapsed + 30) {
        setTimeout(playTick, tickTime);
        elapsed = tickTime;
      }
    }
  }
  function solveCubicBezier(y) {
    return y * y * (3 - 2 * y);
  }
  scheduleTicks();

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      reel.classList.add('animating');
      reel.style.transform = `translateY(${targetY}px)`;
    });
  });

  setTimeout(() => {
    spinning = false;
    pullBtn.disabled = false;
    displayWindow.classList.add('winner');
    playWin();
    spawnConfetti();

    pickedNames.push(targetName);
    savePicked();
    updateHUD();
    updateHistory();
  }, SPIN_DURATION + 100);
}

// ── Show / hide overlays ──
function showOverlay(id) { document.getElementById(id).classList.remove('hidden'); }
function hideOverlay(id) { document.getElementById(id).classList.add('hidden'); }

// ── Init ──
function init() {
  const prefs = loadPrefs();
  noRepeat = prefs.noRepeat || false;
  soundOn = prefs.soundOn !== false;
  names = loadNames();
  pickedNames = loadPicked();

  document.getElementById('no-repeat-check').checked = noRepeat;
  document.getElementById('btn-sound').textContent = soundOn ? 'SOUND: ON' : 'SOUND: OFF';

  if (names.length === 0) {
    document.getElementById('setup-overlay').classList.remove('hidden');
    document.getElementById('main-screen').style.display = 'none';
  } else {
    document.getElementById('setup-overlay').classList.add('hidden');
    document.getElementById('main-screen').style.display = '';
    updateHUD();
    updateHistory();
  }
}

// ── Setup save ──
document.getElementById('setup-save').addEventListener('click', () => {
  const text = document.getElementById('setup-names').value;
  const parsed = parseNames(text);
  if (parsed.length === 0) return;
  names = parsed;
  pickedNames = [];
  saveNames();
  savePicked();
  hideOverlay('setup-overlay');
  document.getElementById('main-screen').style.display = '';
  updateHUD();
  updateHistory();
});

// ── Settings ──
document.getElementById('btn-settings').addEventListener('click', () => {
  document.getElementById('settings-names').value = names.join('\n');
  document.getElementById('no-repeat-check').checked = noRepeat;
  showOverlay('settings-overlay');
});

document.getElementById('settings-save').addEventListener('click', () => {
  const text = document.getElementById('settings-names').value;
  const parsed = parseNames(text);
  if (parsed.length === 0) return;
  names = parsed;
  noRepeat = document.getElementById('no-repeat-check').checked;
  saveNames();
  savePrefs();
  pickedNames = pickedNames.filter(n => names.includes(n));
  savePicked();
  hideOverlay('settings-overlay');
  updateHUD();
  updateHistory();
});

document.getElementById('settings-close').addEventListener('click', () => {
  hideOverlay('settings-overlay');
});

document.getElementById('settings-reset').addEventListener('click', () => {
  if (!confirm('Delete all names and reset? This cannot be undone.')) return;
  names = [];
  pickedNames = [];
  localStorage.removeItem('np_names');
  localStorage.removeItem('np_picked');
  localStorage.removeItem('np_prefs');
  hideOverlay('settings-overlay');
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('setup-overlay').classList.remove('hidden');
  document.getElementById('setup-names').value = '';
});

// ── Clear history ──
document.getElementById('btn-clear-history').addEventListener('click', () => {
  pickedNames = [];
  savePicked();
  updateHUD();
  updateHistory();
});

// ── Sound toggle ──
document.getElementById('btn-sound').addEventListener('click', () => {
  soundOn = !soundOn;
  document.getElementById('btn-sound').textContent = soundOn ? 'SOUND: ON' : 'SOUND: OFF';
  savePrefs();
});

// ── Pull button ──
document.getElementById('pull-btn').addEventListener('click', () => {
  initAudio();
  spin();
});

// ── Lever click ──
document.getElementById('lever').addEventListener('click', () => {
  initAudio();
  spin();
});

// ── Spacebar to pull ──
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !spinning && document.getElementById('main-screen').style.display !== 'none') {
    e.preventDefault();
    initAudio();
    spin();
  }
});

init();
</script>
