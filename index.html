<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name Picker Slot Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 2vh;
  font-family: 'Press Start 2P', monospace;
  user-select: none;
  color: #fff;
}
.hidden { display: none !important; }

/* ── Machine viewport: the sprite + overlay ── */
.machine-viewport {
  position: relative;
  width: 436px;   /* 109px * 4 */
  height: 640px;  /* 160px * 4 */
  cursor: pointer;
}
.machine-img {
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  display: block;
}

/* ── Name overlay: exactly over the white window area ── */
.name-overlay {
  position: absolute;
  left: 13.76%;
  top: 20.00%;
  width: 59.63%;
  height: 20.62%;
  overflow: hidden;
}

.reel {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0; left: 0;
  will-change: transform;
}
.reel.animating {
  transition: transform 4s cubic-bezier(0.0, 0.45, 0.1, 1.0);
}
.reel-item {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 14px;
  color: #000;
  background: #fff;
  padding: 0 4px;
  overflow-wrap: break-word;
  word-break: break-word;
  line-height: 1.4;
}
.reel-item:only-child {
  height: 100%;
}

/* Winner flash */
.name-overlay.winner {
  animation: flash 0.12s step-end 6;
}
@keyframes flash {
  50% { background: #F8F080; }
}
.name-overlay.winner .reel-item:last-child {
  color: #C02020;
  animation: pulse 0.5s ease-in-out infinite alternate;
}
@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.06); }
}

/* ── Main screen: fixed-width wrapper so everything aligns ── */
#main-screen {
  width: 436px;
}

/* ── Controls ── */
.controls {
  display: flex;
  gap: 8px;
  width: 376px;
  margin: 8px 0 0 4px;
}
.ctrl-btn {
  flex: 1;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: #6080C0;
  background: #000;
  border: 2px solid #2040A0;
  padding: 7px 12px;
  cursor: pointer;
  text-align: center;
}
.ctrl-btn:hover { color: #88B0F8; border-color: #4060D0; }

/* ── History ── */
.history {
  margin-top: 10px;
  height: 120px;
  overflow-y: auto;
}
.history h3 { color: #4060C0; font-size: 8px; margin-bottom: 4px; }
.history-item {
  color: #4060A0;
  font-size: 9px;
  padding: 2px 0;
  border-bottom: 1px solid #0a0a20;
  display: flex;
  justify-content: space-between;
}
.history-item:first-child { color: #F8D830; }
.history-num { opacity: 0.5; }

.all-picked {
  color: #F8D830;
  font-size: 10px;
  text-align: center;
  margin-top: 8px;
  animation: blink 0.5s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ── Overlays ── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.94);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.panel {
  background: #080818;
  border: 4px solid #0040FF;
  padding: 24px;
  width: 420px;
  max-height: 90vh;
  overflow-y: auto;
}
.panel h2 {
  color: #F8D830;
  font-size: 14px;
  text-align: center;
  margin-bottom: 8px;
}
.panel p {
  color: #6080C0;
  font-size: 8px;
  text-align: center;
  margin-bottom: 12px;
  line-height: 1.8;
}
.panel textarea {
  width: 100%;
  height: 200px;
  background: #000;
  color: #fff;
  border: 3px solid #0040FF;
  padding: 10px;
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  line-height: 2;
  resize: vertical;
  outline: none;
}
.panel textarea:focus { border-color: #4080FF; }
.panel textarea::placeholder { color: #202040; }
.panel-btn {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  color: #fff;
  background: #0040FF;
  border: 4px solid #000;
  border-top-color: #4080FF;
  border-left-color: #4080FF;
  border-bottom-color: #0020A0;
  border-right-color: #0020A0;
  cursor: pointer;
}
.panel-btn:active {
  border-top-color: #0020A0;
  border-left-color: #0020A0;
  border-bottom-color: #4080FF;
  border-right-color: #4080FF;
}
.panel-row { display: flex; gap: 8px; margin-top: 8px; }
.panel-row .panel-btn { margin-top: 0; }
.panel-btn.secondary { background: #181830; }
.panel-btn.danger { background: #401010; color: #F08080; }
.panel label {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #6080C0;
  font-size: 8px;
  margin-top: 12px;
  cursor: pointer;
}
.panel input[type="checkbox"] {
  accent-color: #0040FF;
  width: 16px;
  height: 16px;
}

/* ── Lever pull animation ── */
.lever-cover {
  position: absolute;
  left: 388px; top: 104px;
  width: 40px; height: 220px;
  background: #000;
  pointer-events: none;
  opacity: 0;
}
.lever-cover.active { opacity: 1; }
.lever-ball {
  position: absolute;
  left: 388px; top: 104px;
  width: 40px; height: 220px;
  background: url(machine.png) -388px -104px / 436px 640px no-repeat;
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  pointer-events: none;
}
@keyframes lever-pull {
  0% { transform: translateY(0); }
  35% { transform: translateY(80px); }
  100% { transform: translateY(0); }
}
.lever-ball.pulling {
  animation: lever-pull 0.5s ease-in-out;
}

.confetti-piece {
  position: fixed;
  z-index: 200;
  pointer-events: none;
  animation: confetti-fall linear forwards;
}
@keyframes confetti-fall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
}

@media (max-width: 460px) {
  #main-screen { width: 327px; }
  .machine-viewport { width: 327px; height: 480px; }
  .controls { width: 282px; margin-left: 3px; }
  .lever-cover { left: 291px; top: 78px; width: 30px; height: 165px; }
  .lever-ball {
    left: 291px; top: 78px; width: 30px; height: 165px;
    background-size: 327px 480px; background-position: -291px -78px;
  }
  .panel { width: 327px; padding: 16px; }
}
</style>
</head>
<body>

<!-- SETUP OVERLAY -->
<div class="overlay" id="setup-overlay">
  <div class="panel">
    <h2>NAME PICKER</h2>
    <p>PASTE STUDENT NAMES BELOW<br>(ONE NAME PER LINE)</p>
    <textarea id="setup-names" placeholder="e.g.&#10;Alice&#10;Bob&#10;Charlie"></textarea>
    <button class="panel-btn" id="setup-save">START</button>
  </div>
</div>

<!-- SETTINGS OVERLAY -->
<div class="overlay hidden" id="settings-overlay">
  <div class="panel">
    <h2>SETTINGS</h2>
    <p>EDIT NAMES (ONE PER LINE)</p>
    <textarea id="settings-names"></textarea>
    <label><input type="checkbox" id="no-repeat-check"> NO-REPEAT MODE</label>
    <button class="panel-btn" id="settings-save">SAVE</button>
    <div class="panel-row">
      <button class="panel-btn secondary" id="settings-close">CANCEL</button>
      <button class="panel-btn danger" id="settings-reset">RESET ALL</button>
    </div>
  </div>
</div>

<!-- MAIN SCREEN -->
<div id="main-screen" style="display:none;">
  <div class="machine-viewport" id="machine-click">
    <img src="machine.png" class="machine-img" alt="Slot Machine" draggable="false">
    <div class="name-overlay" id="display-window">
      <div class="reel" id="reel">
        <div class="reel-item">READY</div>
      </div>
    </div>
    <div class="lever-cover" id="lever-cover"></div>
    <div class="lever-ball" id="lever-ball"></div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="btn-settings">SETTINGS</button>
    <button class="ctrl-btn" id="btn-clear-history">CLEAR HISTORY</button>
    <button class="ctrl-btn" id="btn-sound">SOUND: ON</button>
  </div>

  <div class="history" id="history-panel"></div>
  <div class="all-picked hidden" id="all-picked-msg">ALL NAMES PICKED!</div>
</div>

<script>
let ITEM_HEIGHT;
const SPIN_DURATION = 4000;
const SPIN_CYCLES = 4;

let names = [], pickedNames = [];
let noRepeat = false, soundOn = true, spinning = false, audioCtx = null;

function saveNames() { localStorage.setItem('np_names', JSON.stringify(names)); }
function loadNames() { try { return JSON.parse(localStorage.getItem('np_names')) || []; } catch { return []; } }
function savePicked() { localStorage.setItem('np_picked', JSON.stringify(pickedNames)); }
function loadPicked() { try { return JSON.parse(localStorage.getItem('np_picked')) || []; } catch { return []; } }
function savePrefs() { localStorage.setItem('np_prefs', JSON.stringify({ noRepeat, soundOn })); }
function loadPrefs() { try { return JSON.parse(localStorage.getItem('np_prefs')) || {}; } catch { return {}; } }

function toTitleCase(s) { return s.toLowerCase().trim().replace(/(?:^|\s)\S/g, c => c.toUpperCase()); }
function parseNames(t) { return t.split('\n').map(l => l.trim()).filter(l => l).map(toTitleCase); }
function availableNames() { return noRepeat ? names.filter(n => !pickedNames.includes(n)) : [...names]; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

function updateHUD() {
  const a = availableNames();
  document.getElementById('all-picked-msg').classList.toggle('hidden', !(noRepeat && !a.length && names.length));
}

function updateHistory() {
  const p = document.getElementById('history-panel');
  if (!pickedNames.length) { p.innerHTML = ''; return; }
  p.innerHTML = '<h3>HISTORY</h3>' + [...pickedNames].reverse().map((n, i) =>
    `<div class="history-item"><span>${n}</span><span class="history-num">#${pickedNames.length - i}</span></div>`
  ).join('');
}

function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTick() {
  if (!soundOn || !audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square'; o.frequency.value = 800 + Math.random() * 400;
  g.gain.value = 0.06; g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
  o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.03);
}
function playWin() {
  if (!soundOn || !audioCtx) return;
  [523, 659, 784, 1047].forEach((f, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = f; g.gain.value = 0;
    g.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.12);
    g.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + i * 0.12 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.12 + 0.25);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime + i * 0.12); o.stop(audioCtx.currentTime + i * 0.12 + 0.25);
  });
}
function playLever() {
  if (!soundOn || !audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sawtooth'; o.frequency.value = 150;
  o.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
  g.gain.value = 0.08; g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.15);
}

function spawnConfetti() {
  const c = ['#F8D830','#F84848','#4888F8','#48F888','#F888F8','#F88848'];
  for (let i = 0; i < 40; i++) {
    const e = document.createElement('div'); e.className = 'confetti-piece';
    Object.assign(e.style, {
      left: Math.random()*100+'vw', top: '-10px',
      background: c[Math.random()*c.length|0],
      width: (5+Math.random()*6)+'px', height: (5+Math.random()*6)+'px',
      borderRadius: Math.random()>.5?'50%':'0',
      animationDuration: (1.5+Math.random()*2)+'s',
      animationDelay: (Math.random()*.5)+'s'
    });
    document.body.appendChild(e); setTimeout(() => e.remove(), 4000);
  }
}

function spin() {
  const avail = availableNames();
  if (!avail.length || spinning) return;
  spinning = true; initAudio(); playLever();

  const leverCover = document.getElementById('lever-cover');
  const leverBall = document.getElementById('lever-ball');
  leverCover.classList.add('active');
  leverBall.classList.add('pulling');
  leverBall.addEventListener('animationend', () => {
    leverBall.classList.remove('pulling');
    leverCover.classList.remove('active');
  }, { once: true });

  ITEM_HEIGHT = document.getElementById('display-window').offsetHeight;

  const dw = document.getElementById('display-window');
  dw.classList.remove('winner');

  const target = avail[Math.random() * avail.length | 0];
  const reel = document.getElementById('reel');
  reel.classList.remove('animating');
  reel.style.transform = 'translateY(0)';
  reel.innerHTML = '';

  const items = [];
  for (let c = 0; c < SPIN_CYCLES; c++) items.push(...shuffle([...names]));
  items.push(target);

  items.forEach(n => {
    const d = document.createElement('div');
    d.className = 'reel-item';
    d.textContent = n;
    d.style.height = ITEM_HEIGHT + 'px';
    reel.appendChild(d);
  });

  let elapsed = 0;
  for (let i = 0; i < items.length - 1; i++) {
    const p = i / (items.length - 1), t = p * p * (3 - 2 * p) * SPIN_DURATION;
    if (t > elapsed + 30) { setTimeout(playTick, t); elapsed = t; }
  }

  requestAnimationFrame(() => requestAnimationFrame(() => {
    reel.classList.add('animating');
    reel.style.transform = `translateY(${-((items.length - 1) * ITEM_HEIGHT)}px)`;
  }));

  setTimeout(() => {
    spinning = false;
    dw.classList.add('winner');
    playWin(); spawnConfetti();
    pickedNames.push(target); savePicked(); updateHUD(); updateHistory();
  }, SPIN_DURATION + 100);
}

function init() {
  const p = loadPrefs(); noRepeat = p.noRepeat || false; soundOn = p.soundOn !== false;
  names = loadNames(); pickedNames = loadPicked();
  document.getElementById('no-repeat-check').checked = noRepeat;
  document.getElementById('btn-sound').textContent = soundOn ? 'SOUND: ON' : 'SOUND: OFF';
  if (!names.length) {
    document.getElementById('setup-overlay').classList.remove('hidden');
    document.getElementById('main-screen').style.display = 'none';
  } else {
    document.getElementById('setup-overlay').classList.add('hidden');
    document.getElementById('main-screen').style.display = '';
    updateHUD(); updateHistory();
  }
}

document.getElementById('setup-save').addEventListener('click', () => {
  const n = parseNames(document.getElementById('setup-names').value);
  if (!n.length) return;
  names = n; pickedNames = []; saveNames(); savePicked();
  document.getElementById('setup-overlay').classList.add('hidden');
  document.getElementById('main-screen').style.display = '';
  updateHUD(); updateHistory();
});
document.getElementById('btn-settings').addEventListener('click', () => {
  document.getElementById('settings-names').value = names.join('\n');
  document.getElementById('no-repeat-check').checked = noRepeat;
  document.getElementById('settings-overlay').classList.remove('hidden');
});
document.getElementById('settings-save').addEventListener('click', () => {
  const n = parseNames(document.getElementById('settings-names').value);
  if (!n.length) return;
  names = n;
  noRepeat = document.getElementById('no-repeat-check').checked;
  saveNames(); savePrefs();
  pickedNames = pickedNames.filter(x => names.includes(x)); savePicked();
  document.getElementById('settings-overlay').classList.add('hidden');
  updateHUD(); updateHistory();
});
document.getElementById('settings-close').addEventListener('click', () => {
  document.getElementById('settings-overlay').classList.add('hidden');
});
document.getElementById('settings-reset').addEventListener('click', () => {
  if (!confirm('Delete all names and reset?')) return;
  names = []; pickedNames = [];
  localStorage.removeItem('np_names'); localStorage.removeItem('np_picked'); localStorage.removeItem('np_prefs');
  document.getElementById('settings-overlay').classList.add('hidden');
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('setup-overlay').classList.remove('hidden');
  document.getElementById('setup-names').value = '';
});
document.getElementById('btn-clear-history').addEventListener('click', () => {
  pickedNames = []; savePicked(); updateHUD(); updateHistory();
});
document.getElementById('btn-sound').addEventListener('click', () => {
  soundOn = !soundOn;
  document.getElementById('btn-sound').textContent = soundOn ? 'SOUND: ON' : 'SOUND: OFF';
  savePrefs();
});
document.getElementById('machine-click').addEventListener('click', () => { initAudio(); spin(); });
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !spinning && document.getElementById('main-screen').style.display !== 'none') {
    e.preventDefault(); initAudio(); spin();
  }
});

init();
</script>
</body>
</html>
